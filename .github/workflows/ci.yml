name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Run backend test suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run test suite
        working-directory: backend
        run: pytest -v

  postgres-migrations:
    name: Verify Alembic migrations against PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/postgres
      GEMINI_API_KEY: AIzaSyCITESTPLACEHOLDER0000000000
      ADMIN_API_KEY: ci-postgres-test-admin-key-not-a-real-secret

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply migrations to a fresh PostgreSQL database
        working-directory: backend
        run: alembic upgrade head

      - name: Check for schema drift (models.py vs. migrations)
        working-directory: backend
        run: alembic check

      - name: Start the app and verify /health + seeding
        working-directory: backend
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8000/health; then
              echo "Health check passed"
              exit 0
            fi
            sleep 1
          done
          echo "Health check did not pass in time"
          exit 1

      - name: Verify an authenticated admin request works against PostgreSQL
        run: |
          curl -sf http://127.0.0.1:8000/admin/restaurant/1 \
            -H "X-Admin-API-Key: ci-postgres-test-admin-key-not-a-real-secret"

  docker:
    name: Build and smoke-test Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t restaurant-ai-agent:ci .

      - name: Start container
        run: |
          docker run -d --name ci-smoke-test \
            -e GEMINI_API_KEY=AIzaSyCITESTPLACEHOLDER0000000000 \
            -e ADMIN_API_KEY=ci-smoke-test-admin-key-not-a-real-secret \
            -p 8000:8000 \
            restaurant-ai-agent:ci

      - name: Wait for /health to respond
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8000/health; then
              echo "Health check passed"
              exit 0
            fi
            sleep 1
          done
          echo "Health check did not pass in time"
          docker logs ci-smoke-test
          exit 1

      - name: Show container logs
        if: always()
        run: docker logs ci-smoke-test

      - name: Clean up container
        if: always()
        run: docker rm -f ci-smoke-test
