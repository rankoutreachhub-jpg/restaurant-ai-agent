<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurant AI Agent — Admin Dashboard</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f2efe9;

  a { color: #7a2e2e; }

  /* --- Login view --- */

  }
  #login-box h1 { font-size: 18px; margin: 0 0 4px; }
  #login-box p { font-size: 13px; color: #666; margin: 0 0 20px; }
  #login-box input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 14px;

  }
  #login-box button {
    width: 100%;
    background: #7a2e2e;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 10px;
    font-size: 14px;
    cursor: pointer;
  }
  #login-error {
    color: #b00020;
    font-size: 13px;
    margin-top: 10px;

  }
  #login-footer {
    text-align: center;
    margin-top: 16px;
    font-size: 12px;
    color: #888;
  }

  /* --- App view --- */
  #app-view { display: none; }
  header {
    background: #7a2e2e;
    color: #fff;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; flex: 0 0 auto; }
  .badge {
    background: rgba(255,255,255,0.2);
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 12px;
  }
  header select {
    padding: 6px 10px;
    border-radius: 6px;
    border: none;
    font-size: 13px;
  }
  header .spacer { flex: 1; }
  header button {
    background: rgba(255,255,255,0.15);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 6px;

    font-size: 13px;

  }

  nav {
    display: flex;
    gap: 4px;
    padding: 10px 20px 0;
    background: #fff;
    border-bottom: 1px solid #eee;
    flex-wrap: wrap;
  }
  nav button {
    background: none;
    border: none;

    color: #555;
  }
  nav button.active {
    border-bottom-color: #7a2e2e;
    color: #7a2e2e;

  }

  main {
    padding: 20px;
    max-width: 1000px;
    margin: 0 auto;
  }
  .panel { display: none; }
  .panel.active { display: block; }
  #app-footer {
    text-align: center;
    padding: 10px 20px 20px;
    font-size: 12px;
    color: #888;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    margin-bottom: 20px;
  }
  th, td {
    text-align: left;
    padding: 8px 10px;
    font-size: 13px;
    border-bottom: 1px solid #f0f0f0;
  }
  th { background: #faf8f5; font-weight: 600; }
  td button, .row-actions button {
    font-size: 12px;
    padding: 4px 8px;
    margin-right: 4px;
    border: 1px solid #ddd;
    border-radius: 4px;
    background: #fff;
    cursor: pointer;
  }
  td button.danger { color: #b00020; border-color: #f0c0c0; }

  .card {
    background: #fff;
    border-radius: 8px;
    padding: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    margin-bottom: 20px;
  }
  .card h2 { font-size: 14px; margin: 0 0 12px; }
  .form-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .form-row input, .form-row select, .form-row textarea {
    padding: 7px 10px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 13px;
    flex: 1;
    min-width: 140px;
  }
  .form-row textarea { min-width: 100%; }
  .form-row button, .card > button {
    background: #7a2e2e;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 8px 16px;
    font-size: 13px;
    cursor: pointer;
  }
  .muted { color: #888; font-size: 12px; }
  .error-banner {
    background: #fdeaea;
    color: #b00020;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 14px;
  }
  .key-reveal {
    background: #fff8e1;
    border: 1px solid #f0d97a;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 16px;
    font-size: 13px;
  }
  .key-reveal code {
    display: block;
    word-break: break-all;
    background: #fff;
    padding: 8px;
    border-radius: 4px;
    margin: 6px 0;
    font-size: 12px;
  }
  .thread { background: #fff; border-radius: 8px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .msg { max-width: 75%; padding: 8px 12px; border-radius: 10px; font-size: 13px; margin-bottom: 8px; white-space: pre-wrap; }
  .msg.user { background: #7a2e2e; color: #fff; margin-left: auto; }
  .msg.assistant { background: #f0f0f0; }
  .msg .meta { display: block; font-size: 10px; opacity: 0.7; margin-top: 4px; }

  /* --- Widget tab (Stage 4 Phase F) --- */
  .status-pill { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 12px; font-weight: 600; margin-right: 8px; }
  .status-pill.on { background: #e3f5e6; color: #1e7a34; }
  .status-pill.off { background: #eee; color: #777; }
  .accent-color-row { align-items: center; }
  .accent-color-row input[type="color"] {
    flex: 0 0 auto;
    width: 44px;
    min-width: 44px;
    height: 34px;
    padding: 2px;
    border: 1px solid #ddd;
    border-radius: 6px;
    cursor: pointer;
  }
  .accent-color-row input[type="text"] { max-width: 120px; }
  .embed-snippet {
    background: #2b2b2b;
    color: #eee;
    padding: 12px;
    border-radius: 8px;
    font-size: 12px;
    overflow-x: auto;
    white-space: pre;
    margin: 10px 0;
  }
  .copy-feedback, .save-feedback { color: #1e7a34; font-size: 12px; margin-left: 8px; }
  .preview-status { font-size: 13px; color: #666; margin-top: 10px; }
  .widget-preview-frame {
    width: 380px;
    max-width: 100%;
    height: 640px;
    max-height: 80vh;
    border: 1px solid #ddd;
    border-radius: 8px;
    display: block;
  }
</style>
</head>
<body>

<!--
  Auth model: reuses the existing X-Admin-API-Key header exactly as
  every other admin client (curl/PowerShell) always has — no new
  authentication mechanism. The key is kept only in this browser's
  localStorage and sent only as a request header, never as a query
  string, never logged to the console, and never rendered into the
  page anywhere (the ONE exception, by design: a newly-issued SCOPED
  ADMIN key shown once right after creation/rotation in the Platform
  Admin tab — that is the server's own one-time-reveal behaviour,
  the same key nobody but the operator has seen yet, not this
  session's own authenticating key).
-->

<div id="login-view">
  <div id="login-box">
    <h1>Restaurant AI Agent</h1>
    <p>Enter your admin API key to continue.</p>
    <input type="password" id="login-key" placeholder="X-Admin-API-Key" autocomplete="off">
    <button id="login-btn">Sign in</button>
    <div id="login-error"></div>
    <div id="login-footer"><a href="privacy-policy.html">Privacy Policy</a></div>
  </div>
</div>

<div id="app-view">
  <header>
    <h1>Restaurant AI Agent — Admin</h1>
    <span class="badge" id="role-badge"></span>
    <select id="restaurant-select"></select>
    <div class="spacer"></div>
    <button id="logout-btn">Sign out</button>
  </header>

  <nav id="tabs">
    <button data-tab="restaurant" class="active">Restaurant</button>
    <button data-tab="menu">Menu</button>
    <button data-tab="hours">Opening Hours</button>
    <button data-tab="faqs">FAQs</button>
    <button data-tab="bookings">Bookings</button>
    <button data-tab="conversations">Conversations</button>
    <button data-tab="widget">Widget</button>
    <button data-tab="subscription">Subscription</button>
    <button data-tab="platform" id="platform-tab-btn" hidden>Platform Admin</button>
  </nav>

  <main>
    <div id="global-error"></div>

    <div class="panel active" id="panel-restaurant"></div>
    <div class="panel" id="panel-menu"></div>
    <div class="panel" id="panel-hours"></div>
    <div class="panel" id="panel-faqs"></div>
    <div class="panel" id="panel-bookings"></div>
    <div class="panel" id="panel-conversations"></div>
    <div class="panel" id="panel-widget"></div>
    <div class="panel" id="panel-subscription"></div>
    <div class="panel" id="panel-platform"></div>
  </main>
  <div id="app-footer"><a href="privacy-policy.html">Privacy Policy</a></div>
</div>

<script>
"use strict";

// ---------------------------------------------------------------
// Auth / API helper
// ---------------------------------------------------------------

// Same convention as frontend/index.html: this is a plain static file
// (no build step, often opened directly as file://), so relative fetch
// paths won't reach the backend — the origin has to be spelled out.
const API_BASE = "https://restaurant-ai-agent-production-834f.up.railway.app";

let adminKey = null;
let identity = null;       // { is_superadmin, restaurant_ids }
let restaurants = [];      // superadmin: full list from /admin/platform/restaurants
let currentRestaurantId = null;

const DAY_NAMES = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];

function escapeHtml(value) {
  const div = document.createElement("div");
  div.textContent = value === null || value === undefined ? "" : String(value);
  return div.innerHTML;
}

async function api(path, options = {}) {
  const headers = Object.assign({}, options.headers || {});
  headers["X-Admin-API-Key"] = adminKey;
  if (options.body !== undefined && !(options.body instanceof FormData)) {
    headers["Content-Type"] = "application/json";
  }
  const response = await fetch(API_BASE + path, Object.assign({}, options, { headers }));
  if (response.status === 401) {
    signOut("Your admin key was rejected. Please sign in again.");
    throw new Error("unauthorized");
  }
  return response;
}

function showGlobalError(message) {
  const el = document.getElementById("global-error");
  el.innerHTML = message ? `<div class="error-banner">${escapeHtml(message)}</div>` : "";
}

// A generic response-body error message from the API is safe to show
// (the backend never puts secrets in error bodies — see app/auth.py) —
// this never echoes anything from the request itself, so the admin key
// can never end up here even indirectly.
async function describeError(response, fallback) {
  try {
    const body = await response.json();
    if (body && typeof body.detail === "string") return body.detail;
  } catch (e) { /* not JSON — fall through */ }
  return fallback;
}

// ---------------------------------------------------------------
// Login / session
// ---------------------------------------------------------------

// .trim() alone only strips normal whitespace. A key pasted from a
// rendered web page (e.g. a dashboard UI) can carry invisible Unicode
// characters — zero-width space/joiner, a BOM, a non-breaking space —
// that survive .trim() and don't render on screen, so the field looks
// identical to the real key but sends a byte-for-byte different header
// value than the same key copied from a terminal.
function sanitizeAdminKey(value) {
  return value.replace(/[​-‍﻿ ]/g, "").trim();
}

function signOut(message) {
  adminKey = null;
  identity = null;
  restaurants = [];
  currentRestaurantId = null;
  localStorage.removeItem("adminApiKey");
  document.getElementById("app-view").style.display = "none";
  document.getElementById("login-view").style.display = "flex";
  document.getElementById("login-key").value = "";
  document.getElementById("login-error").textContent = message || "";
}

// Returns { ok: true } on success, or { ok: false, detail } on failure —
// `detail` describes WHY it failed (network/CORS failure vs. the
// server's own rejection reason + HTTP status), since without this the
// login screen can only ever show one fixed, uninformative string no
// matter what actually went wrong, which is unworkable when DevTools/
// the Network tab isn't available to see the real response.
async function trySignIn(key) {
  adminKey = key;
  let response;
  try {
    response = await fetch(API_BASE + "/admin/me", { headers: { "X-Admin-API-Key": key } });
  } catch (e) {
    adminKey = null;
    return {
      ok: false,
      detail: `Could not reach the server at ${API_BASE} (${e.message}). This usually means a network problem or a CORS/blocked-request issue, not a wrong key.`,
    };
  }
  if (!response.ok) {
    adminKey = null;
    const reason = await describeError(response, "(no further detail returned)");
    return { ok: false, detail: `Sign-in rejected — HTTP ${response.status}: ${reason}` };
  }
  identity = await response.json();
  localStorage.setItem("adminApiKey", key);
  await enterApp();
  return { ok: true };
}

async function enterApp() {
  document.getElementById("login-view").style.display = "none";
  document.getElementById("app-view").style.display = "block";
  document.getElementById("role-badge").textContent = identity.is_superadmin ? "Superadmin" : "Restaurant Admin";
  document.getElementById("platform-tab-btn").hidden = !identity.is_superadmin;

  if (identity.is_superadmin) {
    const response = await api("/admin/platform/restaurants");
    restaurants = response.ok ? await response.json() : [];
  } else {
    restaurants = [];
    for (const id of identity.restaurant_ids || []) {
      const response = await api(`/admin/restaurant/${id}`);
      if (response.ok) restaurants.push(await response.json());
    }
  }

  const select = document.getElementById("restaurant-select");
  select.innerHTML = restaurants.map(r => `<option value="${r.id}">${escapeHtml(r.name)} (#${r.id})</option>`).join("");
  currentRestaurantId = restaurants.length ? restaurants[0].id : null;
  select.value = currentRestaurantId;
  select.onchange = () => { currentRestaurantId = Number(select.value); loadActiveTab(); };

  setActiveTab("restaurant");
}

document.getElementById("login-btn").onclick = async () => {
  const key = sanitizeAdminKey(document.getElementById("login-key").value);
  if (!key) return;
  document.getElementById("login-error").textContent = "";
  const result = await trySignIn(key);
  if (!result.ok) {
    document.getElementById("login-error").textContent = result.detail;
    document.getElementById("login-key").value = "";
  }
};
document.getElementById("login-key").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("login-btn").click();
});
document.getElementById("logout-btn").onclick = () => signOut("");

// ---------------------------------------------------------------
// Tabs
// ---------------------------------------------------------------

const TAB_LOADERS = {
  restaurant: loadRestaurantTab,
  menu: loadMenuTab,
  hours: loadHoursTab,
  faqs: loadFaqsTab,
  bookings: loadBookingsTab,
  conversations: loadConversationsTab,
  widget: loadWidgetTab,
  subscription: loadSubscriptionTab,
  platform: loadPlatformTab,
};

function setActiveTab(tab) {
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
  document.getElementById(`panel-${tab}`).classList.add("active");
  loadActiveTab();
}

function loadActiveTab() {
  const active = document.querySelector("#tabs button.active");
  if (!active) return;
  showGlobalError("");
  TAB_LOADERS[active.dataset.tab]();
}

document.querySelectorAll("#tabs button").forEach(btn => {
  btn.addEventListener("click", () => setActiveTab(btn.dataset.tab));
});

// ---------------------------------------------------------------
// Restaurant profile
// ---------------------------------------------------------------

async function loadRestaurantTab() {
  const panel = document.getElementById("panel-restaurant");
  if (!currentRestaurantId) { panel.innerHTML = "<p class='muted'>No restaurant selected.</p>"; return; }

  const response = await api(`/admin/restaurant/${currentRestaurantId}`);
  if (!response.ok) { showGlobalError(await describeError(response, "Could not load restaurant.")); return; }
  const r = await response.json();

  panel.innerHTML = `
    <div class="card">
      <h2>Restaurant profile</h2>
      <form id="restaurant-form">
        <div class="form-row">
          <input name="name" placeholder="Name" value="${escapeHtml(r.name)}" required>
          <input name="phone" placeholder="Phone" value="${escapeHtml(r.phone)}" required>
        </div>
        <div class="form-row">
          <input name="address" placeholder="Address" value="${escapeHtml(r.address)}" required>
          <input name="email" placeholder="Email" value="${escapeHtml(r.email)}" required>
        </div>
        <div class="form-row">
          <input name="map_link" placeholder="Map link" value="${escapeHtml(r.map_link || "")}">
          <input name="seating_capacity" type="number" min="1" placeholder="Seating capacity" value="${r.seating_capacity}" required>
        </div>
        <div class="form-row">
          <textarea name="parking_notes" placeholder="Parking notes" rows="2">${escapeHtml(r.parking_notes || "")}</textarea>
        </div>
        <button type="submit">Save changes</button>
      </form>
    </div>`;

  document.getElementById("restaurant-form").onsubmit = async (e) => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target).entries());
    data.seating_capacity = Number(data.seating_capacity);
    const response = await api(`/admin/restaurant/${currentRestaurantId}`, { method: "PATCH", body: JSON.stringify(data) });
    if (!response.ok) { showGlobalError(await describeError(response, "Could not save.")); return; }
    loadRestaurantTab();
  };
}

// ---------------------------------------------------------------
// Menu
// ---------------------------------------------------------------

async function loadMenuTab() {
  const panel = document.getElementById("panel-menu");
  if (!currentRestaurantId) { panel.innerHTML = "<p class='muted'>No restaurant selected.</p>"; return; }

  const response = await api(`/admin/restaurant/${currentRestaurantId}/menu`);
  if (!response.ok) { showGlobalError(await describeError(response, "Could not load menu.")); return; }
  const items = await response.json();

  const rows = items.map(item => `
    <tr>
      <td>${escapeHtml(item.category)}</td>
      <td>${escapeHtml(item.name)}</td>
      <td>${escapeHtml(item.description || "")}</td>
      <td>£${Number(item.price).toFixed(2)}</td>
      <td>${escapeHtml(item.dietary_tags || "")}</td>
      <td><button class="danger" onclick="deleteMenuItem(${item.id})">Delete</button></td>
    </tr>`).join("");

  panel.innerHTML = `
    <table>
      <thead><tr><th>Category</th><th>Name</th><th>Description</th><th>Price</th><th>Tags</th><th></th></tr></thead>
      <tbody>${rows || "<tr><td colspan='6' class='muted'>No menu items yet.</td></tr>"}</tbody>
    </table>
    <div class="card">
      <h2>Add menu item</h2>
      <form id="menu-form">
        <div class="form-row">
          <input name="category" placeholder="Category" required>
          <input name="name" placeholder="Name" required>
        </div>
        <div class="form-row">
          <input name="price" type="number" step="0.01" min="0" placeholder="Price" required>
          <input name="dietary_tags" placeholder="Dietary tags (optional)">
        </div>
        <div class="form-row"><textarea name="description" placeholder="Description (optional)" rows="2"></textarea></div>
        <button type="submit">Add item</button>
      </form>
    </div>`;

  document.getElementById("menu-form").onsubmit = async (e) => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target).entries());
    data.price = Number(data.price);
    if (!data.description) delete data.description;
    if (!data.dietary_tags) delete data.dietary_tags;
    const response = await api(`/admin/restaurant/${currentRestaurantId}/menu`, { method: "POST", body: JSON.stringify(data) });
    if (!response.ok) { showGlobalError(await describeError(response, "Could not add item.")); return; }
    loadMenuTab();
  };
}

async function deleteMenuItem(itemId) {
  if (!confirm("Delete this menu item?")) return;
  const response = await api(`/admin/restaurant/${currentRestaurantId}/menu/${itemId}`, { method: "DELETE" });
  if (!response.ok) { showGlobalError(await describeError(response, "Could not delete item.")); return; }
  loadMenuTab();
}

// ---------------------------------------------------------------
// Opening hours
// ---------------------------------------------------------------

async function loadHoursTab() {
  const panel = document.getElementById("panel-hours");
  if (!currentRestaurantId) { panel.innerHTML = "<p class='muted'>No restaurant selected.</p>"; return; }

  const response = await api(`/admin/restaurant/${currentRestaurantId}/opening-hours`);
  if (!response.ok) { showGlobalError(await describeError(response, "Could not load opening hours.")); return; }
  const hours = await response.json();
  const byDay = Object.fromEntries(hours.map(h => [h.day_of_week, h]));

  const rows = DAY_NAMES.map(day => {
    const h = byDay[day];
    if (!h) {
      return `<tr><td>${day}</td><td colspan="3" class="muted">Not set up yet</td>
        <td><button onclick="createOpeningDay('${day}')">Create</button></td></tr>`;
    }
    return `<tr>
      <td>${day}</td>
      <td><input type="checkbox" data-day="${day}" class="closed-toggle" ${h.is_closed ? "checked" : ""}></td>
      <td><input type="time" data-day="${day}" class="open-time" value="${h.open_time || ""}" ${h.is_closed ? "disabled" : ""}></td>
      <td><input type="time" data-day="${day}" class="close-time" value="${h.close_time || ""}" ${h.is_closed ? "disabled" : ""}></td>
      <td><button onclick="saveOpeningDay('${day}')">Save</button></td>
    </tr>`;
  }).join("");

  panel.innerHTML = `
    <table>
      <thead><tr><th>Day</th><th>Closed</th><th>Open</th><th>Close</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <p class="muted">"Create" adds a day that doesn't have hours yet (e.g. a newly onboarded restaurant); "Save" updates a day that already exists.</p>`;

  // The disabled state above only reflects what was last saved. Wire the
  // checkbox live so unchecking "Closed" immediately re-enables the time
  // inputs for editing — otherwise a disabled input's stale/empty value
  // would go straight into the PATCH body (OpeningHoursUpdate doesn't
  // validate time format the way the create schema does).
  panel.querySelectorAll(".closed-toggle").forEach(toggle => {
    toggle.addEventListener("change", () => {
      const day = toggle.dataset.day;
      const openInput = panel.querySelector(`.open-time[data-day="${day}"]`);
      const closeInput = panel.querySelector(`.close-time[data-day="${day}"]`);
      openInput.disabled = toggle.checked;
      closeInput.disabled = toggle.checked;
    });
  });
}

async function saveOpeningDay(day) {
  const closed = document.querySelector(`.closed-toggle[data-day="${day}"]`).checked;
  const open = document.querySelector(`.open-time[data-day="${day}"]`).value;
  const close = document.querySelector(`.close-time[data-day="${day}"]`).value;
  if (!closed && (!open || !close)) {
    showGlobalError("Open and close times are required unless the day is marked closed.");
    return;
  }

// ---------------------------------------------------------------
// Widget (Stage 4 Phase F)
// ---------------------------------------------------------------
// Every call below goes through the shared api() helper, so
// X-Admin-API-Key / 401-handling / restaurant scoping (via
// require_restaurant_access on every endpoint it calls) all come for
// free — nothing here introduces a new authorization path. widget_key
// is read from the backend response only; it is never rendered as an
// editable form field anywhere below.

async function loadWidgetTab() {
  const panel = document.getElementById("panel-widget");
  if (!currentRestaurantId) { panel.innerHTML = "<p class='muted'>No restaurant selected.</p>"; return; }

  const response = await api(`/admin/restaurant/${currentRestaurantId}/widget-config`);
  if (response.status === 404) {
    panel.innerHTML = `
      <div class="card">
        <h2>Widget</h2>
        <p class="muted">No widget has been set up for this restaurant yet.</p>
        <button id="create-widget-btn">Create widget</button>
      </div>`;
    document.getElementById("create-widget-btn").onclick = async () => {
      const createResponse = await api(`/admin/restaurant/${currentRestaurantId}/widget-config`, {
        method: "POST", body: JSON.stringify({}),
      });
      if (!createResponse.ok) { showGlobalError(await describeError(createResponse, "Could not create widget.")); return; }
      loadWidgetTab();
    };
    return;
  }
  if (!response.ok) { showGlobalError(await describeError(response, "Could not load widget settings.")); return; }
  const config = await response.json();
  renderWidgetPanel(panel, config);
}

function renderWidgetPanel(panel, config) {
  const origins = config.allowed_origins || [];
  const originRows = origins.map(o => `
    <tr>
      <td>${escapeHtml(o.origin)}</td>
      <td>${new Date(o.created_at).toLocaleString()}</td>
      <td><button class="danger" onclick="deleteWidgetOrigin(${o.id})">Delete</button></td>
    </tr>`).join("");

  // The literal snippet text (used for both display and the clipboard) —
  // built only from API_BASE (a fixed constant) and the widget_key the
  // backend just returned, never anything client-typed.
  // The closing tag below has its slash escaped ("<" + "\/" + "script>")
  // — the unescaped sequence, even just sitting inside a JS string or
  // comment, is read by the HTML PARSER (which knows nothing about JS
  // syntax) as the actual end of THIS script element, silently
  // truncating everything after it, including the rest of this file's
  // real code.
  const embedSnippet =
`<script
  src="${API_BASE}/static/widget/widget.js"
  data-widget-key="${config.widget_key}"
  async
><\/script>`;

  const accentValue = /^#[0-9A-Fa-f]{6}$/.test(config.accent_color || "") ? config.accent_color : "#7a2e2e";

  panel.innerHTML = `
    <div class="card">
      <h2>Widget status &amp; settings</h2>
      <p>
        <span class="status-pill ${config.is_active ? "on" : "off"}">${config.is_active ? "Active" : "Inactive"}</span>
        <span class="status-pill ${config.booking_enabled ? "on" : "off"}">${config.booking_enabled ? "Booking enabled" : "Booking disabled"}</span>
      </p>
      <form id="widget-settings-form">
        <div class="form-row">
          <label class="muted" for="widget-welcome-message" style="flex-basis:100%;">Welcome message</label>
          <textarea id="widget-welcome-message" name="welcome_message" placeholder="Hiya! Welcome to..." rows="2">${escapeHtml(config.welcome_message || "")}</textarea>
        </div>
        <div class="form-row">
          <input name="primary_language" placeholder="Primary language (e.g. en-GB)" value="${escapeHtml(config.primary_language || "")}">
          <input name="logo_url" type="url" placeholder="Logo URL (https://...)" value="${escapeHtml(config.logo_url || "")}">
        </div>
        <div class="form-row accent-color-row">
          <label for="accent-color-picker" class="muted">Accent color</label>
          <input type="color" id="accent-color-picker" value="${accentValue}">
          <input type="text" name="accent_color" id="accent-color-text" placeholder="#7a2e2e" value="${escapeHtml(config.accent_color || "")}">
        </div>
        <div class="form-row">
          <label><input type="checkbox" name="is_active" ${config.is_active ? "checked" : ""}> Active</label>
          <label><input type="checkbox" name="booking_enabled" ${config.booking_enabled ? "checked" : ""}> Booking enabled</label>
        </div>
        <button type="submit">Save changes</button>
        <span class="save-feedback" id="widget-save-feedback"></span>
      </form>
    </div>

    <div class="card">
      <h2>Allowed origins</h2>
      <p class="muted">
        ${origins.length === 0
          ? "No origins configured yet — the widget will refuse every cross-origin request until you add at least one."
          : "Only these origins may embed this widget."}
      </p>
      <table>
        <thead><tr><th>Origin</th><th>Added</th><th></th></tr></thead>
        <tbody>${originRows || "<tr><td colspan='3' class='muted'>No origins yet.</td></tr>"}</tbody>
      </table>
      <form id="add-origin-form">
        <div class="form-row">
          <input name="origin" placeholder="https://www.your-restaurant.com" required>
          <button type="submit">Add origin</button>
        </div>
      </form>
    </div>

    <div class="card">
      <h2>Embed code</h2>
      <p class="muted">Paste this snippet into your restaurant's website to add the chat widget. The key in it is public — safe to paste anywhere on your own site.</p>
      <pre class="embed-snippet">${escapeHtml(embedSnippet)}</pre>
      <button id="copy-embed-btn" type="button">Copy</button>
      <span class="copy-feedback" id="copy-feedback"></span>

      <h2 style="margin-top: 20px;">Preview</h2>
      <button id="show-preview-btn" type="button">Show preview</button>
      <div class="preview-status" id="widget-preview-status" role="status"></div>
      <div id="widget-preview-host"></div>
    </div>`;

  document.getElementById("widget-settings-form").onsubmit = async (e) => {
    e.preventDefault();
    const form = e.target;
    const data = {
      welcome_message: form.welcome_message.value,
      primary_language: form.primary_language.value,
      logo_url: form.logo_url.value,
      // Unlike welcome_message/logo_url, the backend's accent_color
      // validator has no "blank string means clear this field" handling
      // (it's a strict 6-digit hex check with no blank case) — sending
      // "" would always 422, breaking every save where no custom color
      // has been set yet, so an empty field is sent as null instead.
      accent_color: form.accent_color.value || null,
      is_active: form.is_active.checked,
      booking_enabled: form.booking_enabled.checked,
    };
    const saveResponse = await api(`/admin/restaurant/${currentRestaurantId}/widget-config`, {
      method: "POST", body: JSON.stringify(data),
    });
    if (!saveResponse.ok) { showGlobalError(await describeError(saveResponse, "Could not save widget settings.")); return; }
    await loadWidgetTab();
    const feedback = document.getElementById("widget-save-feedback");
    if (feedback) feedback.textContent = "Saved.";
  };

  const colorPicker = document.getElementById("accent-color-picker");
  const colorText = document.getElementById("accent-color-text");
  colorPicker.addEventListener("input", () => { colorText.value = colorPicker.value; });
  colorText.addEventListener("input", () => {
    if (/^#[0-9A-Fa-f]{6}$/.test(colorText.value)) colorPicker.value = colorText.value;
  });

  document.getElementById("add-origin-form").onsubmit = async (e) => {
    e.preventDefault();
    const origin = e.target.origin.value;
    const originResponse = await api(`/admin/restaurant/${currentRestaurantId}/widget-config/origins`, {
      method: "POST", body: JSON.stringify({ origin }),
    });
    if (!originResponse.ok) { showGlobalError(await describeError(originResponse, "Could not add origin.")); return; }
    loadWidgetTab();
  };

  document.getElementById("copy-embed-btn").onclick = async () => {
    const feedbackEl = document.getElementById("copy-feedback");
    try {
      await navigator.clipboard.writeText(embedSnippet);
      feedbackEl.textContent = "Copied!";
      setTimeout(() => { feedbackEl.textContent = ""; }, 2000);
    } catch (e) {
      showGlobalError("Could not copy to clipboard. Please select and copy the snippet manually.");
    }
  };

  document.getElementById("show-preview-btn").onclick = () => showWidgetPreview(config.widget_key);
}

async function deleteWidgetOrigin(originId) {
  if (!confirm("Delete this allowed origin?")) return;
  const response = await api(`/admin/restaurant/${currentRestaurantId}/widget-config/origins/${originId}`, { method: "DELETE" });
  if (!response.ok) { showGlobalError(await describeError(response, "Could not delete origin.")); return; }
  loadWidgetTab();
}

// Reuses the real, unmodified app/static_widget/widget.js (Stage 4 Phase
// E) inside an iframe purely for visual containment: the widget's own
// position:fixed launcher/panel positions relative to WHICHEVER
// browsing context it runs in, so without an iframe it would float
// relative to this entire admin page rather than staying inside this
// card. The iframe is sandboxed with "allow-scripts allow-same-origin"
// (blocks top-navigation/popups from inside it) but NOT away from
// same-origin, so a srcdoc document inherits this admin page's own
// origin for its outgoing fetch() calls — exactly the one, single
// origin config.WIDGET_PREVIEW_ORIGIN already exists to carve out (see
// app/widget_cors.py's existing, unmodified _is_origin_allowed check),
// not a new or different mechanism, and not a per-restaurant allowed
// origin (this preview never touches, and never needs to touch, any
// restaurant's own allowed_origins rows). widget_key alone still
// resolves which restaurant is served — preview changes nothing about
// that.
//
// There is no backend endpoint exposing whether WIDGET_PREVIEW_ORIGIN
// is actually configured, so "fail closed with a clear message" is
// detected client-side: if the widget's own container element hasn't
// appeared in the iframe's document after a few seconds, the real
// CORS/config fetch must have failed (unset/mismatched preview origin,
// or any other reason a real customer's request would also fail for),
// and a plain explanation replaces the empty iframe rather than leaving
// a silent, broken-looking blank box.
function showWidgetPreview(widgetKey) {
  const host = document.getElementById("widget-preview-host");
  const status = document.getElementById("widget-preview-status");
  host.innerHTML = "";
  status.textContent = "Loading preview…";

  const iframe = document.createElement("iframe");
  iframe.className = "widget-preview-frame";
  iframe.title = "Widget preview";
  iframe.setAttribute("sandbox", "allow-scripts allow-same-origin");
  iframe.srcdoc =
    "<!DOCTYPE html><html><head><meta charset=\"utf-8\"></head><body>" +
    `<script src="${API_BASE}/static/widget/widget.js" data-widget-key="${escapeHtml(widgetKey)}" async><\/script>` +
    "</body></html>";
  host.appendChild(iframe);

  setTimeout(() => {
    let launcherFound = false;
    try {
      launcherFound = !!(iframe.contentDocument && iframe.contentDocument.querySelector('div[id$="-container"]'));
    } catch (e) {
      launcherFound = false;
    }
    if (launcherFound) {
      status.textContent = "";
    } else {
      host.innerHTML = "";
      status.textContent =
        "Preview isn't available for this deployment yet — ask your platform operator to set WIDGET_PREVIEW_ORIGIN to this dashboard's origin.";
    }
  }, 2500);
}

    </div>
    <div class="card">
      <h2>Admin users (restaurant-scoped keys)</h2>
      <table>
        <thead><tr><th>#</th><th>Label</th><th>Status</th><th>Restaurants</th><th></th><th>Access</th></tr></thead>
        <tbody>${adminUserRows || "<tr><td colspan='6' class='muted'>No admin users yet.</td></tr>"}</tbody>
      </table>
      <h2>Create admin user</h2>
      <form id="create-admin-user-form">
        <div class="form-row"><input name="label" placeholder="Label (e.g. restaurant name)" required></div>
        <div class="form-row">
          <select name="restaurant_ids" multiple size="4" required>
            ${allRestaurants.map(r => `<option value="${r.id}">${escapeHtml(r.name)} (#${r.id})</option>`).join("")}
          </select>
        </div>
        <p class="muted">Ctrl/Cmd-click to select more than one restaurant.</p>
        <button type="submit">Create admin user</button>
      </form>
    </div>`;

  document.getElementById("onboard-form").onsubmit = async (e) => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target).entries());
    data.seating_capacity = Number(data.seating_capacity);
    const response = await api("/admin/platform/restaurants", { method: "POST", body: JSON.stringify(data) });
    if (!response.ok) { showGlobalError(await describeError(response, "Could not onboard restaurant.")); return; }
    loadPlatformTab();
  };

  document.getElementById("create-admin-user-form").onsubmit = async (e) => {
    e.preventDefault();
    const form = e.target;
    const label = form.label.value;
    const restaurant_ids = Array.from(form.restaurant_ids.selectedOptions).map(o => Number(o.value));
    const response = await api("/admin/platform/admin-users", { method: "POST", body: JSON.stringify({ label, restaurant_ids }) });
    if (!response.ok) { showGlobalError(await describeError(response, "Could not create admin user.")); return; }
    const body = await response.json();
    // loadPlatformTab() replaces panel.innerHTML (including key-reveal-slot),
    // so the reveal must be shown after it finishes, not before — same
    // reasoning as rotateAdminUserKey() below.
    await loadPlatformTab();
    showKeyReveal(body.api_key, `Admin user "${label}" created`);
  };
}

function showKeyReveal(apiKey, heading) {
  const slot = document.getElementById("key-reveal-slot");
  if (!slot) return;
  slot.innerHTML = `
    <div class="key-reveal">
      <strong>${escapeHtml(heading)}</strong> — copy this key now. It will not be shown again.
      <code>${escapeHtml(apiKey)}</code>
    </div>`;
}

async function toggleAdminUserActive(id, makeActive) {
  const response = await api(`/admin/platform/admin-users/${id}`, { method: "PATCH", body: JSON.stringify({ is_active: makeActive }) });
  if (!response.ok) { showGlobalError(await describeError(response, "Could not update admin user.")); return; }
  loadPlatformTab();
}

async function rotateAdminUserKey(id) {
  if (!confirm("Rotate this admin user's key? The old key will stop working immediately.")) return;
  const response = await api(`/admin/platform/admin-users/${id}/rotate-key`, { method: "POST" });
  if (!response.ok) { showGlobalError(await describeError(response, "Could not rotate key.")); return; }
  const body = await response.json();
  await loadPlatformTab();
  showKeyReveal(body.api_key, `Key rotated for "${body.label}"`);
}

async function grantAccess(adminUserId) {
  const restaurantId = document.getElementById(`grant-select-${adminUserId}`).value;
  const response = await api(`/admin/platform/admin-users/${adminUserId}/restaurants/${restaurantId}`, { method: "POST" });
  if (!response.ok) { showGlobalError(await describeError(response, "Could not grant access.")); return; }
  loadPlatformTab();
}

async function revokeAccess(adminUserId) {
  const restaurantId = document.getElementById(`grant-select-${adminUserId}`).value;
  const response = await api(`/admin/platform/admin-users/${adminUserId}/restaurants/${restaurantId}`, { method: "DELETE" });
  if (!response.ok) { showGlobalError(await describeError(response, "Could not revoke access.")); return; }
  loadPlatformTab();
}

async function updateRestaurantSubscription(restaurantId) {
  const plan_code = document.getElementById(`plan-select-${restaurantId}`).value;
  const status = document.getElementById(`status-select-${restaurantId}`).value;
  const response = await api(`/admin/platform/restaurants/${restaurantId}/subscription`, {
    method: "PATCH",
    body: JSON.stringify({ plan_code, status }),
  });
  if (!response.ok) { showGlobalError(await describeError(response, "Could not update subscription.")); return; }
  loadPlatformTab();
}

// ---------------------------------------------------------------
// Boot
// ---------------------------------------------------------------

(async function boot() {
  const savedKey = localStorage.getItem("adminApiKey");
  if (savedKey) {
    const result = await trySignIn(savedKey);
    if (!result.ok) signOut("");
  }
})();
</script>
</body>
</html>
